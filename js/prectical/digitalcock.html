<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="s1" style="width: 30%;">

    </div>

    <script>
         function clock()
         {
            document.getElementById("s1").innerHTML = new Date().toLocaleTimeString();
         }
         setInterval(clock,1000);
         clock();
    </script>
    
</body>
</html>
